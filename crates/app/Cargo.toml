[package]
name = "gust-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gust"
path = "src/main.rs"

[dependencies]
gust-core.workspace = true
gust-ops.workspace = true
gust-remote.workspace = true
gust-thumbs.workspace = true
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
